name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache the JPL ephemeris
        uses: actions/cache@v4
        with:
          path: compute/data
          key: jpl-de440s
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      # tests needing the saved astropixels.com pages are skipped
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
