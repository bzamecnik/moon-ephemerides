[project]
name = "moon-ephemerides"
version = "0.2.0"
description = "Lunar events (phases, apsides, nodes, eclipses) computed with skyfield and JPL ephemerides"
requires-python = ">=3.14"
dependencies = [
    "astronomy-engine>=2.1.19",
    "beautifulsoup4>=4.15.0",
    "numpy>=2.5.5",
    "skyfield>=1.55",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
moon-ephemerides = "moon_ephemerides.cli:main"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:skyfield"]
